:root{--bg:#F4F1EA;--card:#fff;--ink:#1E2B26;--mut:#5E6B65;--line:#E3DED1;--brand:#1F7A5F;--brand2:#14604A;--soft:#E2F1EA;--warn:#B86E00;--warnb:#FBEFD6;--bad:#B3362F;--badb:#F8E1DE;--ok:#237A45;--okb:#DFF1E5;--sh:0 1px 2px rgba(20,40,30,.05);--r:16px;--fs:16px;--side:236px}
:root[data-theme=dark]{--bg:#0F1614;--card:#18211F;--ink:#E5EEE9;--mut:#93A39C;--line:#2A3733;--brand:#3FB68F;--brand2:#2F9C78;--soft:#1B332B;--warn:#E0A24A;--warnb:#33290F;--bad:#EE7A72;--badb:#3A1F1D;--ok:#5CC585;--okb:#17331F;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.45 'DM Sans',system-ui,-apple-system,"Segoe UI",Roboto,"Noto Nastaliq Urdu","Noto Sans Arabic",sans-serif}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:1.15rem}
a{color:var(--brand)}
svg.i{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{min-height:100vh;min-height:100dvh;display:flex}
#side{display:none;flex-direction:column;gap:.25rem;width:72px;padding:1rem .6rem;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
#side .brand{display:flex;align-items:center;gap:.6rem;font-weight:800;color:var(--brand);padding:.25rem .4rem 1rem}
#side .brand b{font-size:1rem;line-height:1.1;display:none}
#side a{display:flex;align-items:center;gap:.75rem;padding:.65rem .7rem;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600}
#side a .lbl{display:none}
#side a:hover{background:var(--soft)}
#side a.on{background:var(--brand);color:#fff}
#side .sp{flex:1}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;background:var(--bg);border-bottom:1px solid var(--line)}
#top h1{font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:2.5rem;height:2.5rem;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;border-radius:10px;cursor:pointer;color:var(--ink)}
.ib:hover{background:var(--soft)}
.ib .dot{position:absolute;top:2px;right:2px;min-width:1.05rem;height:1.05rem;border-radius:1rem;background:var(--bad);color:#fff;font-size:.65rem;display:flex;align-items:center;justify-content:center;padding:0 .2rem;font-weight:700}
#view{padding:1rem;padding-bottom:7rem;max-width:1240px;width:100%;margin:0 auto}
#bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
#bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem 0 .4rem;font-size:.7rem;color:var(--mut);text-decoration:none;font-weight:600}
#bottom a.on{color:var(--brand)}
@media(min-width:720px){#side{display:flex}#bottom{display:none}#view{padding:1.25rem 1.5rem 3rem}#top{padding:.7rem 1.5rem}}
@media(min-width:1024px){#side{width:var(--side)}#side a .lbl{display:inline}#side .brand b{display:block}}
.chip,.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .6rem;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--brand2);border:1px solid transparent;white-space:nowrap}
.chip{cursor:pointer;background:var(--card);border-color:var(--line);color:var(--ink);padding:.4rem .8rem;font-size:.85rem}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.badge.warn{background:var(--warnb);color:var(--warn)}.badge.bad{background:var(--badb);color:var(--bad)}.badge.ok{background:var(--okb);color:var(--ok)}.badge.mut{background:var(--line);color:var(--mut)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.2rem 0 .6rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--sh)}
.card+.card{margin-top:.75rem}
.card h2{margin-bottom:.6rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.55rem .95rem;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.6rem;text-decoration:none}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}
.btn.bad{color:var(--bad);border-color:var(--bad)}

<script>
'use strict';
/* =====================================================================
   HomoeoClinic – core: utils and local database (Developed by Zaeem Azhar)
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _last=0;const now=()=>(_last=Math.max(Date.now(),_last+1));
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ymd=(d=new Date())=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDays=(n,from=new Date())=>ymd(new Date(from.getTime()+n*864e5));
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const r3=n=>Math.round((n+Number.EPSILON)*1000)/1000;
const mem={};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};

/* ---------- device identity & numbering ---------- */
const DEV=()=>{let d=ls.get('hs_dev',null);if(!d){d={code:String.fromCharCode(65+Math.random()*26|0)+(1+Math.random()*8|0),name:''};ls.set('hs_dev',d)}return d};
const CREDIT='Developed by Zaeem Azhar';
const APP='HomoeoClinic';
const nextNo=kind=>{const k='hs_seq_'+kind;const n=ls.get(k,0)+1;ls.set(k,n);return DEV().code+'-'+String(n).padStart(4,'0')};

/* ---------- local-first database ---------------------------------------
   Every record = {id,_u(updatedAt),_d(deleted)...}. Stored permanently in
   IndexedDB on the phone (and asked to be 'persistent' so Android never
   clears it). Stock is NEVER stored as a number – it is the sum of
   immutable ledger rows ("moves"), so a restored backup always merges
   correctly with newer data (newest _u wins).
   ----------------------------------------------------------------------- */
const DB=(()=>{
  const cols=new Map(),vers={},cache={};let idb=null,tm=null;const subs=new Set();
  const bc=('BroadcastChannel' in self)?new BroadcastChannel('hs-tabs'):null;
  const C=c=>{let m=cols.get(c);if(!m){m=new Map();cols.set(c,m)}return m};
  const bump=c=>{vers[c]=(vers[c]||0)+1;delete cache[c];clearTimeout(tm);tm=setTimeout(()=>subs.forEach(f=>{try{f()}catch(e){console.error(e)}}),40)};
  const persist=(c,r)=>{if(!idb)return;try{idb.transaction('rec','readwrite').objectStore('rec').put({k:c+'/'+r.id,c,d:r})}catch(e){console.warn(e)}};
  const api={
    memOnly:false,changed:0,count(){let n=0;for(const m of cols.values())n+=m.size;return n},
    async init(){
      try{
        idb=await new Promise((res,rej)=>{const q=indexedDB.open('homoeo-store',1);q.onupgradeneeded=()=>q.result.createObjectStore('rec',{keyPath:'k'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);q.onblocked=()=>rej(new Error('blocked'))});
        const all=await new Promise((res,rej)=>{const q=idb.transaction('rec').objectStore('rec').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
        for(const e of all){C(e.c).set(e.d.id,e.d);vers[e.c]=1}
      }catch(e){idb=null;api.memOnly=true;console.warn('IndexedDB unavailable – running in memory only',e)}
      if(bc)bc.onmessage=m=>{const{c,r}=m.data||{};if(c&&r)api.remote(c,r.id,r)};
    },
    ver:c=>vers[c]||0,
    vsum:()=>Object.values(vers).reduce((a,b)=>a+b,0),
    get(c,id){const r=C(c).get(id);return r&&!r._d?r:null},
    raw:(c,id)=>C(c).get(id),
    all(c){if(cache[c])return cache[c];const a=[];for(const r of C(c).values())if(!r._d)a.push(r);return cache[c]=a},
    put(c,o){const r={...o};if(!r.id)r.id=rid();r._u=now();C(c).set(r.id,r);persist(c,r);bump(c);bc&&bc.postMessage({c,r});api.changed++;return r},
    del(c,id){const o=C(c).get(id);if(o)api.put(c,{...o,_d:1})},
    remote(c,id,r){
      if(!r||typeof r!=='object'||!r._u)return false;
      r.id=id;const l=C(c).get(id);if(l&&l._u>=r._u)return false;
      C(c).set(id,r);persist(c,r);bump(c);return true},
    entries(){const a=[];for(const[c,m]of cols)for(const r of m.values())a.push([c,r]);return a},
    onChange:f=>subs.add(f),
    export(){const o={app:'homoeoclinic',v:2,by:CREDIT,at:Date.now(),data:{}};for(const[c,r]of api.entries())(o.data[c]??={})[r.id]=r;return o},
    import(o){let n=0;if(!o||!o.data)throw new Error('Not a valid backup file');
      for(const c in o.data)for(const id in o.data[c]){const r=o.data[c][id];if(!r||!r._u)continue;const l=C(c).get(id);if(!l||r._u>l._u){C(c).set(id,r);persist(c,r);n++}}
      Object.keys(o.data).forEach(bump);api.changed++;return n},
    async wipe(){cols.clear();if(idb)await new Promise(res=>{const t=idb.transaction('rec','readwrite');t.objectStore('rec').clear();t.oncomplete=res;t.onerror=res});Object.keys(vers).forEach(bump)}
  };
  return api;
})();


/* =====================================================================
   Native helpers (Android app via Capacitor): save files, share, PDF.
   In a normal browser these fall back to standard web behaviour.
   ===================================================================== */
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const Plug=n=>(NATIVE&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n])||null;
const blobB64=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(',')[1]||'');f.onerror=()=>rej(f.error);f.readAsDataURL(b)});
const FOLDER='HomoeoClinic';
/* save a file inside the phone (Documents/HomoeoClinic). Returns {ok,where,uri} */
async function nativeSave(blob,name,{sub='',dirs=['DOCUMENTS','EXTERNAL','CACHE']}={}){
  const fs=Plug('Filesystem');if(!fs)return{ok:false};
  const data=await blobB64(blob);let err;
  for(const directory of dirs){
    try{const r=await fs.writeFile({path:FOLDER+(sub?'/'+sub:'')+'/'+name,data,directory,recursive:true});
      return{ok:true,uri:r.uri,where:directory==='DOCUMENTS'?'Documents/'+FOLDER+(sub?'/'+sub:''):directory==='EXTERNAL'?'phone storage / '+FOLDER:'temporary storage',dir:directory}}
    catch(e){err=e}}
  console.warn('save failed',err);return{ok:false,err}}
async function nativeShare(uri,title){const sh=Plug('Share');if(!sh||!uri)return false;try{await sh.share({title,files:[uri],dialogTitle:title});return true}catch(e){return false}}
/* ---------- PDF made from HTML (works for Urdu too; used in the Android app where window.print is unavailable) ---------- */
const PDFCSS=`*{box-sizing:border-box}.pdfroot{background:#fff;color:#000;font:12pt/1.4 'DM Sans',system-ui,'Noto Nastaliq Urdu','Noto Sans Arabic',Arial,sans-serif}h1{font-size:19pt;margin:0}h2{font-size:13pt;margin:.55rem 0 .3rem}.ph{border-bottom:2px solid #000;padding-bottom:.4rem;margin-bottom:.6rem}p{margin:.4rem 0}table{border-collapse:collapse;width:100%;font-size:10.5pt}th,td{border:1px solid #888;padding:3px 6px;text-align:left;vertical-align:top}th{background:#eee}td.n,th.n{text-align:right}.note-box{border:1px solid #888;padding:6px 8px;margin-top:8px;white-space:pre-wrap}.lab{border:1px dashed #000;padding:6px;font-size:9pt;line-height:1.3}.lm{font-size:12pt;font-weight:700;margin:2px 0}.ls{font-size:8pt;border-bottom:1px solid #000;margin-bottom:2px}.sig{margin-top:2.2rem;display:flex;justify-content:space-between;font-size:10pt}.sig span{border-top:1px solid #000;padding-top:3px;min-width:35%;text-align:center}.kvt td:first-child{width:34%;color:#444}`;
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('render failed'));i.src=src});
async function pdfFromHTML(html,o={}){
  const kind=o.thermal?'thermal':o.label?'label':'a4';
  const W=kind==='a4'?794:kind==='thermal'?302:227, PH=kind==='a4'?1123:kind==='label'?151:0, M=kind==='a4'?42:8, S=2;
  const box=document.createElement('div');box.style.cssText=`position:fixed;left:-99999px;top:0;width:${W}px;visibility:hidden`;
  box.innerHTML=`<style>${PDFCSS}</style><div class="pdfroot" style="padding:${M}px ${M}px ${kind==='a4'?0:M}px">${html}</div>`;document.body.appendChild(box);
  const root=box.querySelector('.pdfroot');const H=Math.ceil(root.scrollHeight),t0=root.getBoundingClientRect().top;
  const marks=[...root.querySelectorAll('tr,p,h1,h2,.ph,.lab,.note-box,.sig,li')].map(e=>Math.ceil(e.getBoundingClientRect().bottom-t0)).sort((a,b)=>a-b);
  const inner=root.outerHTML;box.remove();
  const FOOT=kind==='a4'?46:0, pages=[];
  if(kind==='thermal'){pages.push([0,H])}
  else{let y0=0,k=0;while(y0<H-1){const tp=k?30:0,room=(PH-FOOT)-tp;let lim=y0+room,end;
      if(lim>=H)end=H;else{const c=marks.filter(m=>m>y0+room*.45&&m<=lim);end=c.length?c[c.length-1]:lim}
      pages.push([y0,end,tp]);y0=end;k++;if(k>60)break}}
  const imgs=[];
  for(let k=0;k<pages.length;k++){
    const [y0,end,tp=0]=pages[k];const ph=kind==='thermal'?H:PH;
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${ph}"><foreignObject x="0" y="${tp-y0}" width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml"><style>${PDFCSS.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</style>${inner}</div></foreignObject></svg>`;
    const im=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
    const cv=document.createElement('canvas');cv.width=W*S;cv.height=ph*S;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);
    if(kind==='a4'){const cut=(tp+(end-y0))*S;g.fillStyle='#fff';g.fillRect(0,cut,cv.width,cv.height-cut);
      g.fillStyle='#667';g.font=`${10*S}px sans-serif`;g.textAlign='center';g.fillText(`HomoeoClinic · ${CREDIT}  ·  Page ${k+1} of ${pages.length}`,cv.width/2,cv.height-16*S);
      g.strokeStyle='#bbb';g.lineWidth=S;g.beginPath();g.moveTo(M*S,cv.height-34*S);g.lineTo(cv.width-M*S,cv.height-34*S);g.stroke()}
    else if(kind==='thermal'){g.fillStyle='#555';g.font=`${8*S}px sans-serif`;g.textAlign='center';g.fillText(CREDIT,cv.width/2,cv.height-4*S)}
    const jb=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));imgs.push({bytes:new Uint8Array(await jb.arrayBuffer()),w:cv.width,h:cv.height})}
  return buildPdf(imgs,kind==='a4'?[595.28,841.89]:null)}
function buildPdf(imgs,size){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const put=x=>{const b=typeof x==='string'?enc.encode(x):x;chunks.push(b);len+=b.length};
  const obj=(n,body)=>{offs[n]=len;put(`${n} 0 obj\n`);put(body);put('\nendobj\n')};
  put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const n=imgs.length,kids=imgs.map((_,i)=>`${3+i*3} 0 R`).join(' ');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`);
  imgs.forEach((im,i)=>{const pw=size?size[0]:im.w*.75/2*1,ph=size?size[1]:im.h*.75/2*1,b=3+i*3;
    obj(b,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw.toFixed(2)} ${ph.toFixed(2)}] /Resources << /XObject << /Im0 ${b+2} 0 R >> >> /Contents ${b+1} 0 R >>`);
    const cs=`q ${pw.toFixed(2)} 0 0 ${ph.toFixed(2)} 0 0 cm /Im0 Do Q`;obj(b+1,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[b+2]=len;put(`${b+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);put(im.bytes);put('\nendstream\nendobj\n')});
  const total=3+n*3,xr=len;put(`xref\n0 ${total}\n0000000000 65535 f \n`);for(let i=1;i<total;i++)put(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  put(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(chunks,{type:'application/pdf'})}
const pdfName=html=>{const m=/<h2>([^<]*)<\/h2>/.exec(html);return((m?m[1]:'document').replace(/&amp;/g,'and').replace(/[^\w\-]+/g,'_').replace(/^_+|_+$/g,'')||'document')+'_'+ymd()+'.pdf'};
async function savePdf(html,o={}){
  try{toast('Making PDF…');const blob=await pdfFromHTML(html,o),name=pdfName(html);
    if(NATIVE){const r=await nativeSave(blob,name,{sub:'PDF'});if(r.ok){toast('PDF saved in '+r.where,'ok');await nativeShare(r.uri,name)}else toast('Could not save the PDF','bad')}
    else download(blob,name)}
  catch(e){console.error(e);toast('Could not make the PDF','bad')}}

/* =====================================================================
   Domain logic: settings, stock ledger, FEFO, sales, purchases, alerts
   ===================================================================== */
const DEFCFG={xPot:[],xForm:[],xBrand:[],shop:'My Homoeo Store & Clinic',phone:'',addr:'',cur:'Rs',expDays:90,deadDays:90,cc:'92',receipt:'a4',allowNeg:false,footer:'Thank you! Get well soon.',defReorder:3,doc:'',qual:'',reg:''};
let ROLE='owner';const isOwner=()=>ROLE==='owner';
let _cfg=null,_cfgV=-1;
const CFG=()=>{const v=DB.ver('settings');if(_cfg&&_cfgV===v)return _cfg;_cfgV=v;return _cfg={...DEFCFG,...(DB.get('settings','main')||{})}};
const money=n=>{n=r2(n||0);return CFG().cur+' '+n.toLocaleString(undefined,{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2})};
const reo=it=>num(it.reorder)||CFG().defReorder;
const fq=n=>{n=r3(n||0);return Number.isInteger(n)?String(n):String(+n.toFixed(2))};

const FORMS=['Dilution','Bio-Combination (BC)','Mother Tincture (Q)','Tablets','Biochemic','Trituration','Ointment / Cream','Drops','Syrup','Globules / Pills','Oil / Lotion','Cosmetic / Other','Consumable (vial, label…)'];
const POTENCIES=['Q','1X','3X','6X','12X','30X','200X','3C','6C','12C','30C','200C','1M','10M','50M','CM','LM1','LM2'];
const REASONS=['Damaged / broken','Expired – discarded','Sample / free','Personal / clinic use','Counting correction','Gift','Other'];

const iname=it=>it?[it.name,it.potency,it.size].filter(Boolean).join(' · '):'—';
const isub=it=>it?[it.brand,it.form,it.rack&&('Rack '+it.rack)].filter(Boolean).join(' · '):'';
const _h=new Map();
const hay=it=>{let h=_h.get(it.id);if(!h||h.u!==it._u){h={u:it._u,s:[it.name,it.alias,it.brand,it.potency,it.size,it.barcode,it.form,it.rack].join(' ').toLowerCase()};_h.set(it.id,h)}return h.s};
const matchItem=(it,q)=>{q=(q||'').toLowerCase().trim();if(!q)return true;return q.split(/\s+/).every(t=>hay(it).includes(t))};
const byName=(a,b)=>(a.name||'').localeCompare(b.name||'')||(a.potency||'').localeCompare(b.potency||'',undefined,{numeric:true});

/* ---------- stock = sum of ledger moves ---------- */
const ST={key:'',item:new Map(),batch:new Map(),nb:new Map(),last:new Map(),sold:new Map(),bi:new Map()};
function stock(){
  const key=DB.ver('moves')+':'+DB.ver('batches');if(ST.key===key)return ST;ST.key=key;
  for(const k of['item','batch','nb','last','sold','bi'])ST[k].clear();
  const since=addDays(-30);
  for(const m of DB.all('moves')){
    ST.item.set(m.item,(ST.item.get(m.item)||0)+m.q);
    if(m.batch)ST.batch.set(m.batch,(ST.batch.get(m.batch)||0)+m.q);else ST.nb.set(m.item,(ST.nb.get(m.item)||0)+m.q);
    if(m.type==='sale'||m.type==='mix'){if(m.d>(ST.last.get(m.item)||''))ST.last.set(m.item,m.d);if(m.d>=since)ST.sold.set(m.item,(ST.sold.get(m.item)||0)-m.q)}}
  for(const b of DB.all('batches')){if(!ST.bi.has(b.item))ST.bi.set(b.item,[]);ST.bi.get(b.item).push(b)}
  return ST}
const qty=id=>r3(stock().item.get(id)||0);
const bq=id=>r3(stock().batch.get(id)||0);
const batchesOf=id=>stock().bi.get(id)||[];
const expState=b=>{if(!b||!b.exp)return'';const t=ymd();if(b.exp<t)return'expired';if(b.exp<=addDays(CFG().expDays))return'soon';return''};
const istate=it=>{const q=qty(it.id);if(q<0)return'neg';if(q===0)return'out';if(q<=reo(it))return'low';return'ok'};

function addStock(itemId,q,o={}){
  let batch='';
  if(o.no||o.exp||o.mfg){
    let b=batchesOf(itemId).find(b=>(b.no||'')===(o.no||'')&&(b.exp||'')===(o.exp||''));
    if(!b)b=DB.put('batches',{item:itemId,no:o.no||'',exp:o.exp||'',mfg:o.mfg||'',buy:o.buy||0,mrp:o.mrp||0});
    batch=b.id}
  return DB.put('moves',{item:itemId,batch,q:r3(q),type:o.type||'open',ref:o.ref||'',d:ymd(),t:Date.now(),note:o.note||''})}

/* FEFO allocation: earliest expiry first, never expired, then un-batched pool */
function plan(needs){
  const used=new Map(),moves=[],short=[],t=ymd(),neg=CFG().allowNeg;
  const use=(k,v)=>used.set(k,(used.get(k)||0)+v);
  for(const L of needs){
    let need=r3(L.q);if(need<=0)continue;
    const bs=batchesOf(L.it).map(b=>({b,a:r3(bq(b.id)-(used.get(b.id)||0))})).filter(x=>x.a>0&&(!x.b.exp||x.b.exp>=t)).sort((x,y)=>(x.b.exp||'9999')<(y.b.exp||'9999')?-1:1);
    for(const x of bs){if(need<=0)break;const g=Math.min(x.a,need);moves.push({item:L.it,batch:x.b.id,q:-g,...L.meta});use(x.b.id,g);need=r3(need-g)}
    if(need>0){const k='nb'+L.it;const a=r3((stock().nb.get(L.it)||0)-(used.get(k)||0));const g=Math.max(0,Math.min(a,need));if(g>0){moves.push({item:L.it,batch:'',q:-g,...L.meta});use(k,g);need=r3(need-g)}}
    if(need>0){short.push({it:L.it,n:need});if(neg)moves.push({item:L.it,batch:'',q:-need,...L.meta})}}
  return{moves,short:neg?[]:short}}

const mixNeeds=L=>(L.mx.ings||[]).filter(g=>g.it).map(g=>{const it=DB.get('items',g.it);const c=num(it&&it.content)||1;return{it:g.it,q:r3(g.q*L.q/c)}});
const mixCost=(ings,mult=1)=>r2((ings||[]).reduce((s,g)=>{const it=DB.get('items',g.it);if(!it)return s;return s+num(it.buy)*g.q/(num(it.content)||1)*mult},0));
const mixSell=ings=>r2((ings||[]).reduce((s,g)=>{const it=DB.get('items',g.it);if(!it)return s;return s+num(it.sell)*g.q/(num(it.content)||1)},0));
const lineCost=L=>L.mx?mixCost(L.mx.ings,L.q):r2(num((DB.get('items',L.it)||{}).buy)*L.q);
const cartTotals=c=>{const sub=r2(c.lines.reduce((s,L)=>s+L.q*L.p,0));const disc=r2(Math.min(sub,c.discType==='%'?sub*num(c.disc)/100:num(c.disc)));return{sub,disc,total:r2(sub-disc)}};

function checkout(c){
  const needs=[];
  c.lines.forEach(L=>{if(L.mx)mixNeeds(L).forEach(n=>needs.push({...n,meta:{type:'mix'}}));else if(L.it)needs.push({it:L.it,q:L.q,meta:{type:'sale'}})});
  const P=plan(needs);if(P.short.length)return{err:P.short};
  const T=cartTotals(c),tender=c.paid==null?T.total:r2(num(c.paid)),paid=Math.min(tender,T.total);
  const id=rid(),d=ymd(),t=Date.now();
  const sale=DB.put('sales',{id,no:nextNo('sale'),d,t,cust:c.cust||'',pat:c.pat||'',sub:T.sub,disc:T.disc,total:T.total,paid,method:c.method||'cash',note:c.note||'',
    lines:c.lines.map(L=>({it:L.it||'',nm:L.nm,q:L.q,p:L.p,cost:lineCost(L),mx:L.mx||null}))});
  P.moves.forEach(m=>DB.put('moves',{...m,ref:id,d,t,note:''}));

function patCourses(pid){
  const vs=patVisits(pid),m=new Map(),t=ymd();
  vs.forEach(v=>(v.rx||[]).forEach(r=>{if(!(r.nm||'').trim())return;const k=rxKey(r);let c=m.get(k);if(!c){c={key:k,nm:r.nm,it:r.it||'',pot:r.pot||'',list:[]};m.set(k,c)}
    const days=num(r.days);c.list.push({d:v.d,vid:v.id,dose:r.dose||'',freq:r.freq||'',days,end:days?addD(v.d,days):'',qty:r.qty||'',stop:r.stop||'',reason:r.reason||''})}));
  const sales=DB.all('sales').filter(s=>s.pat===pid&&!s.void);
  return[...m.values()].map(c=>{const last=c.list[c.list.length-1];
    let st='nodur',left=null;if(last.stop)st='stopped';else if(last.end){left=daysBetween(t,last.end);st=left>=0?'running':'finished'}
    const rebuys=c.it?sales.filter(s=>s.lines.some(l=>l.it===c.it)).length:0;
    return{...c,last,st,left,times:c.list.length,rebuys,first:c.list[0].d}}).sort((a,b)=>({running:0,nodur:1,finished:2,stopped:3}[a.st]-{running:0,nodur:1,finished:2,stopped:3}[b.st])||(a.last.d<b.last.d?1:-1))}

  const fu=vs.filter(v=>v.follow&&!v.fdone).sort((a,b)=>a.follow<b.follow?-1:1)[0];
  const bills=DB.all('sales').filter(s=>s.pat===pid&&!s.void);
  return{n:vs.length,first:vs[0]&&vs[0].d,last:vs.length&&vs[vs.length-1],avgGap:gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):0,fu,bills:bills.length,spent:r2(bills.reduce((s,x)=>s+x.total,0)),fees:r2(vs.reduce((s,v)=>s+num(v.fee),0))}}

const modals=[];
function modal(o){

  el.innerHTML=`<div class="sheet ${o.cls||''}" role="dialog" aria-modal="true"><header><h3>${o.title||''}</h3><button class="ib" data-close aria-label="Close">${ico('x')}</button></header><div class="body">${o.html||''}</div>${o.foot?'<footer></footer>':''}</div>`;
  const close=()=>{if(o.onclose&&o.onclose()===false)return;el.remove();const i=modals.indexOf(el);if(i>=0)modals.splice(i,1)};
  el.close=close;el.q=s=>$(s,el);
  const sticky=o.sticky??!!o.foot;
  el.addEventListener('mousedown',e=>{if(e.target===el&&!sticky)close()});
  $('[data-close]',el).onclick=close;
  if(o.foot)o.foot.forEach(b=>{const x=document.createElement('button');x.className='btn '+(b.cls||'');x.innerHTML=b.t;x.onclick=async()=>{const r=await b.fn(el);if(r!==false&&!b.keep)close()};$('footer',el).appendChild(x)});
  document.body.appendChild(el);modals.push(el);if(o.mount)o.mount(el);return el}

  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=''}

const docHead=(title,sub='',withDoc=false)=>{const c=CFG();return`<div class="ph"><h1>${esc(c.shop)}</h1>${withDoc&&c.doc?`<div><b>${esc(c.doc)}</b> ${esc(c.qual)}${c.reg?' · Reg. no. '+esc(c.reg):''}</div>`:''}<div>${esc([c.phone,c.addr].filter(Boolean).join(' · '))}</div><h2>${esc(title)}</h2>${sub?`<div>${esc(sub)}</div>`:''}</div>`};
const tableHTML=(head,rows,foot)=>{const nums=head.map((_,i)=>rows.some(r=>typeof r[i]==='number')&&rows.every(r=>typeof r[i]==='number'||r[i]===''||r[i]==null));
  return`<table><thead><tr>${head.map((h,i)=>`<th class="${nums[i]?'n':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${nums[i]?'n':''}" dir="auto">${esc(typeof v==='number'?(Number.isInteger(v)?v:v.toFixed(2)):v)}</td>`).join('')}</tr>`).join('')}</tbody>${foot?`<tfoot><tr>${foot.map((v,i)=>`<td class="${nums[i]?'n':''}"><b>${esc(v)}</b></td>`).join('')}</tr></tfoot>`:''}</table>`};
function printDoc(html,o={}){
  if(NATIVE)return savePdf(html,o);
  const p=$('#print');p.innerHTML=html+(o.label?'':`<div class="pcredit">HomoeoClinic · ${esc(CREDIT)}</div>`);p.className=o.label?'label':o.thermal?'thermal':'';
  let st=$('#pstyle');if(!st){st=document.createElement('style');st.id='pstyle';document.head.appendChild(st)}
  st.textContent=o.label?'@page{size:60mm 40mm;margin:2mm}':o.thermal?'@page{size:80mm auto;margin:3mm}':'@page{size:A4;margin:12mm 12mm 16mm}';
  setTimeout(()=>window.print(),80)}
const waUrl=(phone,text)=>{let p=String(phone||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p=CFG().cc+p.slice(1);return'https://wa.me/'+p+'?text='+encodeURIComponent(text)};
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied','ok')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied','ok')}catch(x){toast('Copy failed','bad')}a.remove()}}

function exportMenu(o){
  // o:{title,head,rows,foot,fname,text,phone,email,subject,extraHtml,sub}
  const fname=(o.fname||o.title).replace(/[^\w\-]+/g,'_')+'_'+ymd();
  const makeX=()=>toXLSX(o.head,o.foot?[...o.rows,o.foot]:o.rows,o.title);
  const m=modal({title:'Export / send',html:`<div class="stack"><div class="mut">${esc(o.title)} · ${o.rows.length} rows</div>
    <div class="grid g2"><button class="btn" data-x="xlsx">${ico('file')} Excel (.xlsx)</button><button class="btn" data-x="csv">${ico('download')} CSV</button><button class="btn" data-x="pdf">${ico('print')} PDF / Print</button>
    ${o.text!=null?`<button class="btn" data-x="wa">${ico('chat')} WhatsApp</button><button class="btn" data-x="mail">${ico('mail')} Email</button><button class="btn" data-x="copy">${ico('copy')} Copy text</button>`:''}
    ${(navigator.share||NATIVE)?`<button class="btn" data-x="share">${ico('share')} Share file…</button>`:''}</div>${o.extraHtml||''}</div>`,
   mount(el){el.addEventListener('click',async e=>{const b=e.target.closest('[data-x]');if(!b)return;const x=b.dataset.x;
     if(x==='xlsx')download(makeX(),fname+'.xlsx');
     else if(x==='csv')download(new Blob([toCSV(o.head,o.foot?[...o.rows,o.foot]:o.rows)],{type:'text/csv;charset=utf-8'}),fname+'.csv');
     else if(x==='pdf')printDoc(docHead(o.title,o.sub||'Date: '+fdate(ymd()))+tableHTML(o.head,o.rows,o.foot)+(o.noteHtml||''));
     else if(x==='wa')window.open(waUrl(o.phone,o.text),'_blank');
     else if(x==='mail')location.href='mailto:'+encodeURIComponent(o.email||'')+'?subject='+encodeURIComponent(o.subject||o.title)+'&body='+encodeURIComponent(o.text);
     else if(x==='copy')copyText(o.text);
     else if(x==='share'){if(NATIVE){const r=await nativeSave(makeX(),fname+'.xlsx',{sub:'Exports'});if(r.ok)await nativeShare(r.uri,o.title);else toast('Could not save the file','bad');return}try{const f=new File([makeX()],fname+'.xlsx',{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:o.title,text:o.text||o.title});else await navigator.share({title:o.title,text:o.text||o.title})}catch(e){}}})}});
  return m}

/* ---------- camera barcode scanner (best effort; typing the code always works) ---------- */
function scanBarcode(cb){
  let stream=null,stop=false;
  const end=()=>{stop=true;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null};
  const m=modal({title:'Scan barcode',sticky:false,onclose:end,html:`<div class="stack"><div style="background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3"><video id="scv" playsinline muted style="width:100%;height:100%;object-fit:cover"></video></div><div class="mut" id="scm">Opening camera…</div><div class="grid g2" style="grid-template-columns:1fr auto;align-items:end"><label class="fld">Or type the code<input id="scc" inputmode="numeric" autocomplete="off"></label><button class="btn pri" id="scu">Use</button></div></div>`,
   mount(el){
    const use=v=>{v=String(v||'').trim();if(!v)return;end();A.closeTop();cb(v)};
    $('#scu',el).onclick=()=>use($('#scc',el).value);$('#scc',el).addEventListener('keydown',e=>{if(e.key==='Enter')use(e.target.value)});
    (async()=>{const msg=$('#scm',el);
      if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent='Camera scanning is not available on this phone. Type the code below (a USB / Bluetooth barcode scanner also works).';return}
      try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});const v=$('#scv',el);v.srcObject=stream;await v.play();msg.textContent='Point the camera at the barcode…';
        const det=new BarcodeDetector();const loop=async()=>{if(stop)return;try{const r=await det.detect(v);if(r.length&&r[0].rawValue){use(r[0].rawValue);return}}catch(e){}setTimeout(loop,250)};loop()}
      catch(e){msg.textContent='Could not open the camera. Allow camera access, or type the code below.'}})()}});
  return m}
A.closeTop=()=>{const m=modals[modals.length-1];if(m&&m.close)m.close()};

V.today={title:"Today's sales",live:false,render(){
  const d=DSU.d||ymd(),T=dayTotals(d),own=isOwner();
  const week=[...Array(7)].map((_,i)=>{const x=addDays(-i);return[x,dayTotals(x)]});
  return`<p class="mut" style="margin:0 0 .7rem">Write the money you took <b>without making a bill</b>. You can add several times in a day – everything is added together with your bills.</p>
  ${(()=>{const dr=drawer(d);return`<div class="card cashbox"><h2><span>Cash box · ${d===ymd()?'today':fdate(d)}</span></h2><div class="mut">Cash that should be in the drawer right now</div><div class="big">${money(dr.box)}</div>
   <div class="kv" style="margin-top:.4rem"><dt>Cash from bills</dt><dd>${money(dr.bills)}</dd><dt>Cash day-sale entries</dt><dd>${money(dr.manual)}</dd><dt>Old dues collected (cash)</dt><dd>${money(dr.dues)}</dd><dt>Paid to suppliers (cash)</dt><dd>− ${money(dr.sup)}</dd><dt>Expenses paid out</dt><dd>− ${money(dr.exps)}</dd></div></div>`})()}
  <div class="mut" style="margin:.2rem 0 .2rem;font-size:.85rem">Quick packages (fills the amount)</div><div class="pkgs">${pkgList().map((p,i)=>`<button class="pkg" data-a="ds-pkg" data-i="${i}">${esc(p.n)}<small>${money(p.fee)}${p.days?' · follow-up in '+p.days+' days':''}</small></button>`).join('')}</div>
  <div class="card dsform"><label class="fld">Amount sold<div class="bigamt"><span>${esc(CFG().cur)}</span><input id="ds-amt" inputmode="decimal" placeholder="0" autocomplete="off"></div></label>
   <div class="chips" style="padding:.7rem 0 .2rem">${[['cash','Cash'],['online','Online / card'],['credit','On credit']].map(([k,t])=>`<button class="chip ${DSU.m===k?'on':''}" data-a="ds-m" data-m="${k}">${t}</button>`).join('')}</div>
   <div class="grid g2" style="margin-top:.4rem">${F.d('Date','ds-d',d,{'data-c':'ds-date'})}${own?F.n('Profit (optional)','ds-p',''):''}</div>
   ${F.t('Note (optional)','ds-n','',{placeholder:'e.g. clinic patients medicines, morning shift'})}${DSU.pkg&&DSU.pkg.days?F.s('Patient (to set the follow-up date)','ds-pat',[['','— none —'],...DB.all('patients').sort((a,b)=>a.name.localeCompare(b.name)).map(p=>[p.id,p.name+(p.phone?' · '+p.phone:'')])],''):''}
   <div class="mut" style="margin:.4rem 0 .6rem">Time: <b>${TOD(new Date().getHours())[0]}</b> · ${clockStr()}</div>
   <button class="btn pri bigpay block" data-a="ds-save">Save sale</button></div>
  <div class="card"><h2><span>${d===ymd()?'Today':fdate(d)}</span><b class="gt">${money(T.total)}</b></h2>
   ${T.manual.length?T.manual.map(x=>`<div class="row" data-a="ds-edit" data-id="${x.id}"><div class="r-main"><b>${money(x.amt)}${x.note?' · '+esc(x.note):''}</b><small>${esc({cash:'Cash',online:'Online / card',credit:'On credit'}[x.method]||'Cash')} · ${todOf(x.t)} ${ftime(x.t)}${num(x.profit)&&own?' · profit '+money(x.profit):''}</small></div>${ico('edit')}</div>`).join(''):'<div class="mut" style="padding:.3rem 0 .6rem">No manual entries for this day yet.</div>'}
   <div class="kv" style="margin-top:.4rem"><dt>From bills (${T.bills})</dt><dd>${money(T.billTotal)}</dd><dt>Manual entries</dt><dd>${money(T.manTotal)}</dd>${own?`<dt>Profit</dt><dd>${money(T.profit)}</dd>`:''}</div></div>
  <div class="card"><h2><span>Cash paid out (expenses)</span><b class="gt">${money(drawer(d).exps)}</b></h2>
   <div class="chips" style="padding:0 0 .4rem">${EXP_CATS.map(c=>`<button class="chip ${EXU.c===c?'on':''}" data-a="ex-c" data-c="${esc(c)}">${c}</button>`).join('')}</div>
   <div class="grid g2" style="grid-template-columns:1fr 1fr auto;align-items:end">${F.n('Amount','ex-amt','')}${F.t('Note','ex-n','',{placeholder:'optional'})}<button class="btn pri" data-a="ex-save">Add</button></div>
   ${drawer(d).list.map(x=>`<div class="row" data-a="ex-del" data-id="${x.id}"><div class="r-main"><b>${money(x.amt)} · ${esc(x.cat)}</b><small>${esc(x.note||'')}${x.note?' · ':''}${ftime(x.t)} · tap to delete</small></div></div>`).join('')}</div>
  <div class="card"><h2>Last 7 days</h2>${week.map(([x,t])=>`<div class="row" data-a="ds-day" data-d="${x}"><div class="r-main"><b>${x===ymd()?'Today':fdate(x)}</b><small>${t.bills} bill(s) · ${t.manual.length} manual</small></div><div class="r-side"><b>${money(t.total)}</b></div></div>`).join('')}</div>`}};
const EXU={c:EXP_CATS[0]};
A['ex-c']=d=>{EXU.c=d.c;$$('[data-a="ex-c"]').forEach(c=>c.classList.toggle('on',c.dataset.c===d.c))};
A['ex-save']=()=>{const a=num($('[name="ex-amt"]').value);if(a<=0){toast('Write the amount','bad');return}DB.put('expenses',{d:DSU.d||ymd(),t:Date.now(),amt:a,cat:EXU.c,note:$('[name="ex-n"]').value.trim()});toast('Expense saved','ok');render(true)};
A['ex-del']=async d=>{if(!await ask('Delete this expense?',{ok:'Delete',bad:true}))return;DB.del('expenses',d.id);render(true)};
A['ds-pkg']=d=>{const p=pkgList()[+d.i];if(!p)return;DSU.pkg=p;$('#ds-amt').value=p.fee;const n=$('[name="ds-n"]');if(n&&!n.value)n.value=p.n;render(true);setTimeout(()=>{$('#ds-amt').value=p.fee;const n=$('[name="ds-n"]');if(n&&!n.value)n.value=p.n},0)};
A['ds-m']=d=>{DSU.m=d.m;$$('.dsform .chip').forEach(c=>c.classList.toggle('on',c.dataset.m===d.m))};
HC['ds-date']=v=>{DSU.d=v;render(true)};
A['ds-day']=d=>{DSU.d=d.d;render();window.scrollTo(0,0)};
A['ds-save']=()=>{const a=num($('#ds-amt').value);if(a<=0){toast('Write the amount first','bad');$('#ds-amt').focus();return}
  const p=$('[name="ds-p"]'),n=$('[name="ds-n"]'),d=($('[name="ds-d"]').value)||ymd();
  const ps=$('[name="ds-pat"]');const pt=ps?ps.value:'';DB.put('daysales',{d,t:Date.now(),amt:a,method:DSU.m,profit:p?num(p.value):0,note:n.value.trim(),pat:pt,pkg:DSU.pkg?DSU.pkg.n:''});if(pt&&DSU.pkg)pkgVisit(pt,DSU.pkg,a);DSU.pkg=null;DSU.d=d;toast('Saved: '+money(a),'ok');render(true)};
A['ds-edit']=d=>{const x=DB.get('daysales',d.id);if(!x)return;
  modal({title:'Edit sale entry',html:`<form class="stack" onsubmit="return false">${F.n('Amount','amt',x.amt)}${F.s('Received as','method',[['cash','Cash'],['online','Online / card'],['credit','On credit']],x.method||'cash')}${isOwner()?F.n('Profit','profit',x.profit||''):''}${F.d('Date','d',x.d)}${F.t('Note','note',x.note||'')}</form>`,
   foot:[{t:ico('trash'),cls:'bad',fn:async()=>{if(!await ask('Delete this entry?',{ok:'Delete',bad:true}))return false;DB.del('daysales',x.id);render(true)}},{t:'Cancel',fn:()=>{}},{t:'Save',cls:'pri',fn:el=>{const f=formData(el);if(num(f.amt)<=0){toast('Write the amount','bad');return false}DB.put('daysales',{...x,amt:num(f.amt),method:f.method,profit:f.profit!==undefined?num(f.profit):x.profit,d:f.d||x.d,note:f.note.trim()});toast('Saved','ok');render(true)}}]})};
A['hide-guide']=()=>{ls.set('hs_noguide',true);render(true)};
A['home-addstock']=()=>pickItem(it=>addStockForm(it.id),{title:'Which medicine arrived?',allowNew:true});
A.goto=d=>go(d.r);
A.demo=async()=>{if(DB.all('items').length&&!await ask('Add demo medicines to your existing data?'))return;loadDemo();toast('Demo data added','ok')};

/* ---------------- Sell / POS ---------------- */
const newCart=()=>({lines:[],cust:'',pat:'',disc:'',discType:'Rs',paid:null,method:'cash',note:''});
let CART=Object.assign(newCart(),ls.get('hs_cart',null)||{});
const saveCart=()=>ls.set('hs_cart',CART);
const held=()=>ls.get('hs_held',[]);
V.sell={title:'Sell / Billing',live:false,render(){
  return`<div class="pos"><section class="pos-l"><div class="bar" style="margin:0"><div class="search big">${ico('search')}<input id="pq" data-i="pos-q" placeholder="Scan barcode or type medicine…" autocomplete="off" dir="auto"></div><button class="btn" data-a="pos-scan" aria-label="Scan barcode">${ico('scan')}</button></div>
  <div class="mut" style="margin:.6rem 0 .2rem;font-size:.85rem">Treatment packages</div><div class="pkgs">${pkgList().map((p,i)=>`<button class="pkg" data-a="pos-pkg" data-i="${i}">${esc(p.n)}<small>${money(p.fee)}${p.days?' · follow-up in '+p.days+' days':''}</small></button>`).join('')}</div><div id="pres" style="margin-top:.2rem"></div>
  <div class="bar" style="margin-top:.8rem"><button class="btn" data-a="pos-mix">${ico('flask')} Custom mixture</button><button class="btn" data-a="pos-formula">Saved formula</button><button class="btn" data-a="pos-fee">+ Fee / service</button><button class="btn" data-a="pos-held">Held bills <span class="badge" id="heldN">${held().length}</span></button></div></section>
  <section class="pos-r"><div class="card" id="cart"></div></section></div><button class="cartbar" id="cartbar" data-a="goto-cart" style="display:none"></button>`},
  mount(){drawRes('');drawCart();const q=$('#pq');q.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const v=q.value.trim();if(!v)return;
    const ex=DB.all('items').find(i=>i.barcode&&i.barcode===v);const m=ex?[ex]:DB.all('items').filter(i=>!i.arch&&matchItem(i,v));if(m.length===1||ex){posAdd(m[0].id);q.value='';drawRes('')}});
    if(innerWidth>=720)q.focus()}};
function drawRes(q){
  const el=$('#pres');if(!el)return;
  const items=q?DB.all('items').filter(i=>!i.arch&&matchItem(i,q)).sort(byName).slice(0,24):topItems(8);
  el.innerHTML=(q?'':'<div class="sec" style="margin-top:0"><h3>Frequently sold</h3></div>')+(items.length?`<div class="res">${items.map(i=>`<div class="row" data-a="pos-add" data-id="${i.id}"><div class="r-main"><b>${esc(iname(i))}</b><small>${esc(i.brand||'')} · ${money(i.sell)}</small></div><div class="r-side"><span class="qty ${istate(i)}">${fq(qty(i.id))}</span></div></div>`).join('')}</div>`:emptyBox('No match','Check spelling or add it in Stock.'))}
HI['pos-q']=v=>drawRes(v);
function posAdd(id){
  const it=DB.get('items',id);if(!it)return;
  const L=CART.lines.find(l=>l.it===id&&!l.mx);
  if(L)L.q=r3(L.q+1);else CART.lines.push({it:id,nm:iname(it),q:1,p:num(it.sell)});
  if(qty(id)<=0)toast(iname(it)+' is out of stock','bad');drawCart()}
A['pos-add']=d=>{posAdd(d.id);const q=$('#pq');if(q&&innerWidth>=720){q.value='';drawRes('');q.focus()}};
function addMixLine(mx,price,fid){CART.lines.push({it:'',nm:'Mixture: '+(mx.name||'custom'),q:1,p:num(price),mx,fid:fid||''});drawCart()}
let POSMORE=false;
A['pos-more']=()=>{POSMORE=!POSMORE;drawCart()};
function drawCart(){
  const el=$('#cart');if(!el)return;saveCart();const pats=DB.all('patients');
  const more=POSMORE||CART.disc||CART.note||CART.paid!=null||CART.pat||CART.method!=='cash';
  el.innerHTML=`<h2><span>Current bill</span>${CART.lines.length?'<button class="btn sm" data-a="pos-clear">Clear</button>':''}</h2>
  ${CART.lines.length?CART.lines.map((L,i)=>{const have=L.it?qty(L.it):null;const sub=L.mx?(L.mx.ings||[]).map(g=>((DB.get('items',g.it)||{}).name||'?')+' '+fq(g.q)).join(', '):'';
    return`<div class="line"><div class="nm">${esc(L.nm)}<small>${L.mx?esc(sub):!L.it?'Service / fee':`In stock: <span style="${have<L.q?'color:var(--bad);font-weight:700':''}">${fq(have)}</span>`}</small></div><button class="ib" data-a="pos-rm" data-idx="${i}" aria-label="Remove">${ico('trash')}</button>
    <div class="ctl"><button class="step" data-a="pos-step" data-idx="${i}" data-d="-1">−</button><input data-c="pos-q" data-idx="${i}" inputmode="decimal" value="${fq(L.q)}" aria-label="Quantity"><button class="step" data-a="pos-step" data-idx="${i}" data-d="1">+</button><span class="mut">×</span><input data-c="pos-p" data-idx="${i}" inputmode="decimal" value="${r2(L.p)}" aria-label="Price" style="width:5.5rem"><span class="tot">${money(L.q*L.p)}</span></div></div>`}).join(''):emptyBox('Bill is empty','Tap a medicine to add it.')}
  <label class="fld" style="margin-top:.8rem">Customer <span style="font-weight:500">(only needed if they pay later)</span><select data-c="pos-cust">${custOpts().map(([v,t])=>`<option value="${v}"${v===CART.cust?' selected':''}>${esc(t)}</option>`).join('')}<option value="__new">＋ New customer…</option></select></label>
  <div class="tot-box" id="tb"></div>
  <button class="more-toggle" data-a="pos-more">${more?'▾':'▸'} Discount, payment, patient &amp; note</button>
  ${more?`<div class="stack" style="margin:.6rem 0 .8rem"><div class="grid g2"><label class="fld">Discount<span style="display:flex;gap:.3rem"><input data-i="pos-disc" inputmode="decimal" value="${esc(CART.disc)}" placeholder="0"><select data-c="pos-dt" style="width:5rem"><option value="Rs"${CART.discType==='Rs'?' selected':''}>${esc(CFG().cur)}</option><option value="%"${CART.discType==='%'?' selected':''}>%</option></select></span></label>
   <label class="fld">Paid by<select data-c="pos-method">${['cash','card','UPI / wallet','bank','credit'].map(m=>`<option${m===CART.method?' selected':''}>${m}</option>`).join('')}</select></label></div>
   <label class="fld">Amount received (leave empty = full amount)<input data-i="pos-paid" inputmode="decimal" value="${CART.paid==null?'':esc(CART.paid)}" placeholder="full amount"></label>
   ${pats.length?`<label class="fld">Patient (optional)<select data-c="pos-pat"><option value="">—</option>${pats.sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}"${p.id===CART.pat?' selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`:''}
   <label class="fld">Note for yourself<textarea data-i="pos-note" dir="auto" rows="2" placeholder="e.g. remaining amount tomorrow">${esc(CART.note)}</textarea></label></div>`:''}
  <div class="bar" style="margin:.8rem 0 0"><button class="btn" data-a="pos-hold" ${CART.lines.length?'':'disabled'}>Hold</button><button class="btn pri bigpay" style="flex:1" data-a="pos-pay" ${CART.lines.length?'':'disabled'}>Complete sale</button></div>`;
  updTot();const cb=$('#cartbar');if(cb){const n=CART.lines.length;cb.style.display=n?'':'none';cb.innerHTML=`${ico('cart')}<span>${n} item(s) · ${money(cartTotals(CART).total)}</span><b>Review bill ↓</b>`}}
A['goto-cart']=()=>{const c=$('#cart');c&&c.scrollIntoView({behavior:'smooth',block:'start'})};
function updTot(){
  const tb=$('#tb');if(!tb)return;const T=cartTotals(CART),paid=CART.paid==null||CART.paid===''?T.total:num(CART.paid);
  tb.innerHTML=`<div class="r"><span>Subtotal</span><span>${money(T.sub)}</span></div>${T.disc?`<div class="r"><span>Discount</span><span>− ${money(T.disc)}</span></div>`:''}<div class="r big"><span>Total</span><span>${money(T.total)}</span></div>${paid<T.total?`<div class="r" style="color:var(--bad)"><span>Balance (on credit)</span><span>${money(T.total-paid)}</span></div>`:paid>T.total?`<div class="r"><span>Change to return</span><span>${money(paid-T.total)}</span></div>`:''}`}
HC['pos-q']=(v,el,d)=>{const L=CART.lines[+d.idx];if(!L)return;const n=num(v);if(n<=0)CART.lines.splice(+d.idx,1);else L.q=r3(n);drawCart()};
HC['pos-p']=(v,el,d)=>{const L=CART.lines[+d.idx];if(L){L.p=Math.max(0,num(v));drawCart()}};
A['pos-step']=d=>{const L=CART.lines[+d.idx];if(!L)return;L.q=r3(L.q+ +d.d);if(L.q<=0)CART.lines.splice(+d.idx,1);drawCart()};
A['pos-rm']=d=>{CART.lines.splice(+d.idx,1);drawCart()};
A['pos-clear']=async()=>{if(await ask('Clear the whole bill?',{ok:'Clear',bad:true})){CART=newCart();drawCart()}};
HC['pos-cust']=(v,el)=>{if(v==='__new'){el.value=CART.cust;partyForm('c',null,id=>{CART.cust=id;drawCart()});return}CART.cust=v;saveCart()};
HC['pos-pat']=v=>{CART.pat=v;saveCart()};
HC['pos-method']=v=>{CART.method=v;saveCart()};
HC['pos-dt']=v=>{CART.discType=v;saveCart();updTot()};
HI['pos-disc']=v=>{CART.disc=v;saveCart();updTot()};
HI['pos-paid']=v=>{CART.paid=v===''?null:v;saveCart();updTot()};
HI['pos-note']=v=>{CART.note=v;saveCart()};
A['pos-hold']=()=>{const h=held();h.push({...CART,at:Date.now()});ls.set('hs_held',h);CART=newCart();drawCart();const n=$('#heldN');if(n)n.textContent=h.length;toast('Bill put on hold','ok')};
A['pos-held']=()=>{const h=held();
  modal({title:'Held bills',html:h.length?h.map((b,i)=>`<div class="row static"><div class="r-main"><b>${b.lines.length} item(s) · ${money(cartTotals(b).total)}</b><small>${new Date(b.at).toLocaleString()}${b.cust?' · '+esc(custName(b.cust)):''}</small></div><button class="btn sm pri" data-a="held-use" data-i="${i}">Resume</button><button class="btn sm bad" data-a="held-del" data-i="${i}">Delete</button></div>`).join(''):emptyBox('No held bills')})};
A['held-use']=d=>{const h=held(),b=h.splice(+d.i,1)[0];if(!b)return;if(CART.lines.length){h.push({...CART,at:Date.now()})}ls.set('hs_held',h);delete b.at;CART=Object.assign(newCart(),b);A.closeTop();const n=$('#heldN');if(n)n.textContent=h.length;drawCart()};
A['held-del']=d=>{const h=held();h.splice(+d.i,1);ls.set('hs_held',h);A.closeTop();const n=$('#heldN');if(n)n.textContent=h.length};
A['pos-mix']=()=>mixBuilder({once:true});
A['pos-fee']=()=>modal({title:'Add fee / service',html:`<form class="stack" onsubmit="return false">${F.t('Description','nm','Consultation fee')}${F.n('Amount','amt','',{required:true})}</form>`,foot:[{t:'Cancel',fn:()=>{}},{t:'Add',cls:'pri',fn:el=>{const f=formData(el);if(num(f.amt)<=0||!f.nm.trim()){toast('Enter description and amount','bad');return false}CART.lines.push({it:'',nm:f.nm.trim(),q:1,p:num(f.amt)});drawCart()}}]});
A['pos-formula']=()=>{const fs=DB.all('formulas').sort((a,b)=>a.name.localeCompare(b.name));
  modal({title:'Saved formulas',html:fs.length?fs.map(f=>`<div class="row" data-a="pos-use-formula" data-id="${f.id}"><div class="r-main"><b>${esc(f.name)}</b><small>${esc(mixSummary(f.ings))}</small></div><div class="r-side"><b>${money(f.price)}</b></div></div>`).join(''):emptyBox('No saved formulas yet','Create them in Mixtures.')})};
A['pos-use-formula']=d=>{const f=DB.get('formulas',d.id);if(!f)return;A.closeTop();addMixLine({name:f.name,ings:f.ings,note:f.note},f.price,f.id)};
A['pos-scan']=()=>scanBarcode(v=>{const it=DB.all('items').find(i=>i.barcode&&i.barcode===v);if(it){posAdd(it.id);toast(iname(it)+' added','ok')}else toast('No medicine has barcode '+v,'bad')});
A['stock-scan']=()=>scanBarcode(v=>{const it=DB.all('items').find(i=>i.barcode&&i.barcode===v);if(it)openItem(it.id);else{SU.q=v;const q=$('#sq');if(q)q.value=v;drawStock();toast('No medicine has that barcode','bad')}});
A['form-scan']=()=>scanBarcode(v=>{const e=document.querySelector('.modal [name=barcode]');if(e)e.value=v});
A['pos-pkg']=d=>{const p=pkgList()[+d.i];if(!p)return;CART.lines.push({it:'',nm:p.n,q:1,p:p.fee});CART.pkg={n:p.n,days:p.days,fee:p.fee};drawCart();
  if(p.days&&!CART.pat)toast('Choose the patient in the bill to set their follow-up date automatically','ok');else toast(p.n+' added','ok')};
A['pos-pay']=async()=>{
  if(!CART.lines.length)return;const T=cartTotals(CART),paid=CART.paid==null||CART.paid===''?T.total:num(CART.paid);
  if(paid<T.total&&!CART.cust)return toast('Select a customer to sell on credit (or enter full payment)','bad');
  const r=checkout(CART);
  if(r.err){const msg=r.err.map(e=>`• ${iname(DB.get('items',e.it))}: short by ${fq(e.n)}`).join('\n');
    modal({title:'Not enough stock',html:`<p style="margin-top:0">Stock is not enough (expired batches are excluded):</p><pre class="code">${esc(msg)}</pre><p class="mut">Reduce the quantity, add stock, or allow negative stock in Settings.</p>`});return}

  modal({title:'Sale complete',html:`<div class="stack" style="text-align:center"><div style="width:3.4rem;height:3.4rem;border-radius:50%;background:var(--okb);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto">${ico('check')}</div><b style="font-size:1.6rem">${money(s.total)}</b><div class="mut">Bill ${esc(s.no)}${r.change?` · Return change ${money(r.change)}`:''}${s.total>s.paid?` · Due ${money(s.total-s.paid)}`:''}</div></div>`,

const HMAP={name:['name','medicine','medicine name','item','product'],potency:['potency','pot'],size:['size','pack','pack size'],brand:['brand','company','manufacturer'],form:['form','type','category'],buy:['buy','buy price','purchase','purchase price','cost'],sell:['sell','sell price','selling price','price','sale price'],mrp:['mrp'],reorder:['reorder','reorder level','min','min stock','minimum'],stock:['stock','qty','quantity','opening','opening stock'],rack:['rack','shelf','location'],barcode:['barcode','sku','code'],supplier:['supplier','distributor','vendor'],batch:['batch','batch no','batch number'],expiry:['expiry','exp','expiry date','exp date'],content:['content'],cunit:['content unit'],unit:['unit']};
A['import-csv']=()=>{if(modals.length)A.closeTop();
  modal({title:'Import medicines',html:`<div class="stack"><p class="mut" style="margin:0">Use a CSV file (Excel: <i>Save As → CSV</i>) with a header row. Columns recognised: <span class="code">name, potency, size, brand, form, buy, sell, mrp, reorder, stock, rack, barcode, supplier, batch, expiry</span>. Only <b>name</b> is required. Existing medicines (same name + potency + size) are skipped.</p>
   <button class="btn" data-a="csv-template">${ico('download')} Download template</button><input type="file" id="csvf" accept=".csv,.txt,text/csv"><textarea id="csvt" rows="5" placeholder="…or paste CSV text here" dir="auto"></textarea><div id="csvinfo" class="mut"></div></div>`,
   mount(el){$('#csvf',el).onchange=async e=>{const f=e.target.files[0];if(f)$('#csvt',el).value=await f.text();info()};$('#csvt',el).oninput=info;
     function info(){const r=parseCSV($('#csvt',el).value);$('#csvinfo',el).textContent=r.length>1?(r.length-1)+' rows found':''}},
   foot:[{t:'Cancel',fn:()=>{}},{t:'Import',cls:'pri',fn:el=>{
     const rows=parseCSV($('#csvt',el).value);if(rows.length<2){toast('Nothing to import','bad');return false}
     const hd=rows[0].map(h=>h.trim().toLowerCase()),col={};for(const k in HMAP){const i=hd.findIndex(h=>HMAP[k].includes(h));if(i>=0)col[k]=i}
     if(col.name==null){toast('No "name" column found','bad');return false}
     let add=0,skip=0;const sups=DB.all('suppliers');
     for(const r of rows.slice(1)){const g=k=>col[k]!=null?(r[col[k]]||'').trim():'';const name=g('name');if(!name)continue;
       const potency=g('potency'),size=g('size');
       if(DB.all('items').some(x=>x.name.toLowerCase()===name.toLowerCase()&&(x.potency||'')===potency&&(x.size||'')===size)){skip++;continue}
       let sup='';if(g('supplier')){let s=sups.find(x=>x.name.toLowerCase()===g('supplier').toLowerCase());if(!s){s=DB.put('suppliers',{name:g('supplier'),phone:'',note:''});sups.push(s)}sup=s.id}
       const it=DB.put('items',{name,potency,size,brand:g('brand'),form:g('form'),buy:num(g('buy')),sell:num(g('sell')),mrp:num(g('mrp'))||num(g('sell')),reorder:num(g('reorder')),rack:g('rack'),barcode:g('barcode'),sup,unit:g('unit'),content:g('content')?num(g('content')):'',cunit:g('cunit'),c:Date.now()});
       if(num(g('stock'))>0)addStock(it.id,num(g('stock')),{type:'open',no:g('batch'),exp:/^\d{4}-\d{2}-\d{2}$/.test(g('expiry'))?g('expiry'):'',buy:num(g('buy')),note:'Imported opening stock'});add++}
     toast(`${add} imported${skip?`, ${skip} skipped (already exist)`:''}`,'ok')}}]})};
A['csv-template']=()=>download(new Blob([toCSV(['name','potency','size','brand','form','buy','sell','mrp','reorder','stock','rack','barcode','supplier','batch','expiry'],[['Arnica Montana','30C','30 ml','SBL','Dilution',140,220,220,5,12,'A1','','Ali Distributors','B123','2027-12-31']])],{type:'text/csv'}),'medicines_template.csv');

const AU={q:'',vals:{}};
V.audit={title:'Count stock',live:false,render(){
  return`<div class="bar"><button class="btn" data-a="goto" data-r="stock">← Stock</button><div class="search">${ico('search')}<input data-i="audit-q" placeholder="Search…" value="${esc(AU.q)}" autocomplete="off"></div><button class="btn" data-a="audit-sheet">${ico('print')} Count sheet</button></div>
  <p class="mut" style="margin:.2rem 0 .8rem">Type the physically counted quantity. Leave blank if not counted. Only differences are adjusted.</p><div id="alist"></div>
  <div class="bar" style="position:sticky;bottom:4.5rem;justify-content:flex-end"><button class="btn pri" data-a="audit-apply">Apply counted differences <span class="badge" id="acnt">0</span></button></div>`},
  mount(){drawAudit()}};
function drawAudit(){const el=$('#alist');if(!el)return;const items=DB.all('items').filter(i=>!i.arch&&matchItem(i,AU.q)).sort(byName).slice(0,150);
  el.innerHTML=items.map(i=>{const q=qty(i.id),v=AU.vals[i.id];return`<div class="row static"><div class="r-main"><b>${esc(iname(i))}</b><small>${esc(isub(i))} · system: ${fq(q)}</small></div><input data-i="audit-v" data-id="${i.id}" inputmode="decimal" value="${v??''}" style="width:5.5rem;text-align:center" placeholder="count"></div>`}).join('')+(items.length===150?'<div class="mut" style="text-align:center">Showing first 150 – use search</div>':'');cnt()}
const cnt=()=>{const n=Object.values(AU.vals).filter(v=>v!=='').length;const e=$('#acnt');if(e)e.textContent=n};
HI['audit-q']=v=>{AU.q=v;drawAudit()};
HI['audit-v']=(v,el,d)=>{if(v==='')delete AU.vals[d.id];else AU.vals[d.id]=v;cnt()};
A['audit-sheet']=()=>{const rows=DB.all('items').filter(i=>!i.arch).sort(byName).map(i=>[i.rack||'',iname(i),qty(i.id),'']);exportMenu({title:'Stock count sheet',head:['Rack','Medicine','System qty','Counted'],rows})};
A['audit-apply']=async()=>{const ids=Object.keys(AU.vals);const diffs=ids.map(id=>({id,d:r3(num(AU.vals[id])-qty(id))})).filter(x=>x.d!==0);
  if(!diffs.length){toast('No differences found','ok');return}
  if(!await ask(`${diffs.length} medicine(s) differ from the system.\n\n`+diffs.slice(0,12).map(x=>`${iname(DB.get('items',x.id))}: ${x.d>0?'+':''}${fq(x.d)}`).join('\n')+(diffs.length>12?'\n…':'')+'\n\nApply these corrections?',{ok:'Apply'}))return;
  diffs.forEach(x=>DB.put('moves',{item:x.id,batch:'',q:x.d,type:'adjust',ref:'',d:ymd(),t:Date.now(),note:'Stock audit'}));AU.vals={};toast('Audit applied','ok');drawAudit()};

const mixSummary=ings=>(ings||[]).map(g=>{const it=DB.get('items',g.it);return it?`${it.name}${it.potency?' '+it.potency:''} ${fq(g.q)}${ulab(it)}`:'?'}).join(', ');
V.mix={title:'Mixtures & Formulas',render(){
  const fs=DB.all('formulas').sort((a,b)=>a.name.localeCompare(b.name));
  return`<div class="bar"><button class="btn pri" data-a="mix-new">${ico('plus')} New mixture / formula</button></div>

  ${fs.length?fs.map(f=>`<div class="row" data-a="mix-edit" data-id="${f.id}"><div class="r-main"><b>${esc(f.name)}</b><small>${esc(mixSummary(f.ings))}</small></div><div class="r-side"><b>${money(f.price)}</b><small>cost ${money(mixCost(f.ings))}</small></div><button class="btn sm pri" data-a="mix-use" data-id="${f.id}">Use</button></div>`).join(''):emptyBox('No saved formulas','Example: “Cough mix” = Drosera Q 5 ml + Ipecac 30C 5 ml + Bryonia 30C 5 ml.')}`}};

let MX=null;
function mixBuilder(o){
  const f=o.id?DB.get('formulas',o.id):null;
  MX=f?JSON.parse(JSON.stringify(f)):{name:'',price:'',note:'',ings:[]};MX.once=!!o.once;
  const m=modal({title:o.once?'One-time mixture (for this bill)':f?'Edit formula':'New formula',cls:'full',sticky:true,html:`<div class="stack">
   <label class="fld">Mixture name<input data-i="mx-name" value="${esc(MX.name)}" dir="auto" placeholder="e.g. Cough mix, Mrs Khan’s drops"></label>
   <div><div class="sec" style="margin-top:0"><h3>Ingredients</h3><button class="btn sm" data-a="mx-add">${ico('plus')} Add medicine</button></div><div id="mxl"></div></div>
   <div class="tot-box" id="mxt"></div>
   <div class="grid g2"><label class="fld">Selling price (per bottle / dose)<input data-i="mx-price" inputmode="decimal" value="${esc(MX.price)}" placeholder="0"></label><div style="align-self:end"><button class="btn block" data-a="mx-suggest">Use suggested price</button></div></div>
   <label class="fld">Notes (how to make, dose, advice)<textarea data-i="mx-note" dir="auto" rows="3" placeholder="e.g. add 90 ml distilled water, shake well; 5 ml thrice daily">${esc(MX.note||'')}</textarea></label></div>`,
   mount(){drawMX()},
   foot:[{t:'Cancel',fn:()=>{}},
    ...(o.once?[]:[{t:'Save formula',fn:()=>{if(!saveMX())return false;toast('Formula saved','ok')}}]),
    {t:o.once?'Add to bill':'Save & add to bill',cls:'pri',fn:()=>{
      if(!MX.ings.length){toast('Add at least one ingredient','bad');return false}
      if(!MX.name.trim())MX.name=o.once?'Custom mixture':'';
      let fid='';if(!o.once){const r=saveMX();if(!r)return false;fid=r.id}
      addMixLine({name:MX.name,ings:MX.ings,note:MX.note},MX.price===''?mixSell(MX.ings):num(MX.price),fid);location.hash='#/sell';toast('Added to bill','ok')}},
    ...(o.once?[{t:'Save as formula too',fn:()=>{if(!MX.name.trim()){toast('Give it a name first','bad');return false}if(!saveMX())return false;toast('Saved to formulas','ok');return false}}]:[])]});
  return m}
function saveMX(){if(!MX.name.trim()){toast('Enter a name','bad');return null}if(!MX.ings.length){toast('Add at least one ingredient','bad');return null}
  const r=DB.put('formulas',{id:MX.id,name:MX.name.trim(),price:num(MX.price)||mixSell(MX.ings),note:MX.note||'',ings:MX.ings.filter(g=>g.it&&num(g.q)>0).map(g=>({it:g.it,q:num(g.q)}))});MX.id=r.id;return r}
function drawMX(){const el=$('#mxl');if(!el)return;
  el.innerHTML=MX.ings.length?MX.ings.map((g,i)=>{const it=DB.get('items',g.it);if(!it)return'';const need=r3(num(g.q)/(num(it.content)||1)),have=qty(g.it);
    return`<div class="row static"><div class="r-main"><b>${esc(iname(it))}</b><small style="${need>have?'color:var(--bad)':''}">uses ${fq(need)} pack(s) · in stock ${fq(have)}</small></div><input data-i="mx-q" data-idx="${i}" inputmode="decimal" value="${esc(g.q)}" style="width:5rem;text-align:center" aria-label="Quantity"><span class="mut" style="min-width:2.2rem">${esc(ulab(it))}</span><button class="ib" data-a="mx-rm" data-idx="${i}">${ico('trash')}</button></div>`}).join(''):emptyBox('No ingredients yet','Add the medicines this mixture is made of.');
  updMX()}
function updMX(){const t=$('#mxt');if(!t)return;const c=mixCost(MX.ings),s=mixSell(MX.ings),p=MX.price===''?s:num(MX.price);
  t.innerHTML=`<div class="r"><span>Ingredient cost</span><span>${money(c)}</span></div><div class="r"><span>Suggested price (at normal selling rates)</span><span>${money(s)}</span></div><div class="r big"><span>Profit at your price</span><span>${money(p-c)}</span></div>`}
HI['mx-name']=v=>{MX.name=v};HI['mx-price']=v=>{MX.price=v;updMX()};HI['mx-note']=v=>{MX.note=v};
HI['mx-q']=(v,el,d)=>{const g=MX.ings[+d.idx];if(g){g.q=v;updMX()}};
A['mx-rm']=d=>{MX.ings.splice(+d.idx,1);drawMX()};

async function hashPin(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hs:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'hs:'+p)h=(h*33)^c.charCodeAt(0);return'x'+(h>>>0)}}

const APPVER='1.0';
const b64e=u=>{let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s)},b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function cryptoKey(pw,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptText(text,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await cryptoKey(pw,salt);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(text)));return JSON.stringify({app:'homoeoclinic-encrypted',v:1,salt:b64e(salt),iv:b64e(iv),data:b64e(ct)})}
async function decryptText(o,pw){const k=await cryptoKey(pw,b64d(o.salt));return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},k,b64d(o.data)))}
const Backup=(()=>{
  const snapDB=()=>new Promise((res,rej)=>{const q=indexedDB.open('homoeo-snaps',1);q.onupgradeneeded=()=>q.result.createObjectStore('s',{keyPath:'k'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
  const cfg=()=>({auto:true,...ls.get('hs_bkcfg',{})});
  const pw=()=>ls.get('hs_bkpw','');
  let busy=false,lastCount=-1;
  const api={
    cfg,pw,lastOut:()=>ls.get('hs_bk_out',null),lastAuto:()=>ls.get('hs_bk_auto',null),
    setCfg(o){ls.set('hs_bkcfg',{...cfg(),...o})},
    async text(){const j=JSON.stringify(DB.export());return pw()?await encryptText(j,pw()):j},
    async fileName(){const d=new Date();return`${APP}-backup-${ymd(d)}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${pw()?'-protected':''}.json`},
    async now(){const t=await api.text(),name=await api.fileName();const r=await download(new Blob([t],{type:'application/json'}),name);if(!NATIVE||(r&&r.ok)){ls.set('hs_bk_out',Date.now());return true}return false},
    async snaps(){try{const db=await snapDB();return await new Promise(res=>{const q=db.transaction('s').objectStore('s').getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>b.t-a.t));q.onerror=()=>res([])})}catch(e){return[]}},
    async auto(force){
      if(busy||!isOwner()&&!force)return;const c=cfg();if(!c.auto&&!force)return;if(!DB.count())return;
      if(!force&&DB.changed===lastCount)return;busy=true;
      try{const t=await api.text(),now=Date.now();let ok=false,where='';
        try{const db=await snapDB(),all=await api.snaps();await new Promise(res=>{const tx=db.transaction('s','readwrite'),st=tx.objectStore('s');
          const last=all[0];if(!last||now-last.t>30*60*1000||force)st.put({k:'s'+now,t:now,n:DB.count(),enc:!!pw(),text:t});
          all.slice(8).forEach(x=>st.delete(x.k));tx.oncomplete=res;tx.onerror=res});ok=true;where='inside the app'}catch(e){console.warn('snap',e)}
        if(NATIVE){const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];const r=await nativeSave(new Blob([t],{type:'application/json'}),`auto-backup-${day}.json`,{sub:'Auto-backup',dirs:['DOCUMENTS','EXTERNAL']});if(r.ok){ok=true;where=r.where}}
        lastCount=DB.changed;if(ok)ls.set('hs_bk_auto',{t:now,where,n:DB.count()})}
      finally{busy=false}},
    async restoreText(text,mode){let o=JSON.parse(text);
      if(o&&o.app==='homoeoclinic-encrypted'){let p=pw(),tries=0;for(;;){if(!p){p=await askText('This backup is password-protected.\nEnter the backup password:')}if(p==null)return null;
        try{o=JSON.parse(await decryptText(o,p));break}catch(e){tries++;toast('Wrong password','bad');p='';if(tries>4)return null}}}
      if(!o||!o.data)throw new Error('Not a valid backup file');
      if(mode==='replace'){await DB.wipe()}
      return DB.import(o)},
    async persist(){try{if(navigator.storage&&navigator.storage.persist)return await navigator.storage.persist()}catch(e){}return false},
    async status(){let persisted=false,est=null;try{persisted=!!(navigator.storage&&navigator.storage.persisted&&await navigator.storage.persisted());est=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate():null}catch(e){}return{persisted,est}},
    /* empty database but an automatic copy exists -> offer to bring it back */
    async rescue(){if(DB.count()>3||DB.memOnly)return;const s=await api.snaps();let nat=null;
      if(NATIVE){try{const fs=Plug('Filesystem');const day=await fs.readdir({path:FOLDER+'/Auto-backup',directory:'DOCUMENTS'});const f=(day.files||[]).sort((a,b)=>(b.mtime||0)-(a.mtime||0))[0];if(f){const r=await fs.readFile({path:FOLDER+'/Auto-backup/'+f.name,directory:'DOCUMENTS',encoding:'utf8'});nat={t:f.mtime||0,text:r.data,from:'Documents/'+FOLDER}}}catch(e){}}
      const best=[...s.map(x=>({t:x.t,text:x.text,from:'the app'})),...(nat?[nat]:[])].sort((a,b)=>b.t-a.t)[0];if(!best||!best.text)return;
      if(await ask(`Your data looks empty, but an automatic backup was found (${new Date(best.t).toLocaleString()}, from ${best.from}).\n\nBring your data back now?`,{ok:'Restore my data'})){try{const n=await api.restoreText(best.text,'merge');if(n!=null)toast(n+' records restored','ok')}catch(e){toast('Could not read that backup','bad')}}}
  };
  return api})();

 dash:['Type a medicine name in the search box to see its stock and price.','<b>Today\'s sales</b> – write the money you took in a day without making bills.','<b>Add stock</b> when a delivery arrives. <b>Order list</b> shows what to buy. <b>Patients</b> and <b>Notes</b> are one tap away.','The bottom bar always takes you to Home, Sell (billing), Medicines, Orders and More.'],
 today:['Type the amount, choose Cash / Online / Credit and tap <b>Save sale</b>.','You can save several entries in one day. Everything is added to the day\'s total together with your bills.','Forgot yesterday? Change the date and save.'],
 sell:['Tap a medicine to add it to the bill. Change quantity with + / −.','Only choose a <b>Customer</b> if they will pay later (credit).','Tap <b>Complete sale</b> – stock reduces automatically. You can print a receipt or medicine labels.','Use <b>Custom mixture</b> to make a one-time mixture for a patient.'],
 stock:['Tap a medicine to add stock, remove damaged ones, or sell it.','<b>Add</b> creates a new medicine. Tick several potencies, or type your own if it is not in the list.','Filters: Low = running out, Finished = zero stock, Expiring = expiry is near.'],
 orders:['<b>To reorder</b> shows medicines running low, grouped by supplier – press <b>Create list</b> (or create all).','Edit quantities, add a note, then <b>Send / Export</b> to share by WhatsApp, Excel or PDF.','When the delivery comes, press <b>Delivery arrived</b> to add everything to stock at once.'],
 suppliers:['Add the distributors you buy from. Link each medicine to its supplier when you add the medicine.','Open a supplier to see its medicines, what you owe, and to create its order list.'],
 mix:['Save formulas you make often. Ingredient stock reduces when you sell it.','For a one-time mixture, use <b>Custom mixture</b> on the Sell screen.'],
 notes:['Write anything you want to remember. Add a reminder date and it will show in Alerts.','Pinned notes appear on the Home screen.'],
 patients:['Open a patient to see visits, medicines with dates / days left, and bills.','<b>New visit</b> records complaint, medicines, dose, days and the next visit date. The time of day is saved too.','<b>Bill this Rx</b> puts the prescribed medicines straight into a bill.'],
 people:['Customers who buy on credit and their balances. Tap a name to receive a payment or send a WhatsApp reminder.'],
 reports:['Choose a report at the top and a date range. <b>Daily closing</b> shows your cash at the end of the day.','Use <b>Export / Print</b> for Excel, CSV or PDF.'],
 alerts:['Everything that needs action: low stock, expiry, unpaid dues, follow-ups.','Tap the truck icon to put a medicine on your order list.'],
 backup:['Tap <b>Back up now</b> and send the file to WhatsApp, Google Drive or Gmail. Do this every week.','Automatic copies are kept for you, but a copy outside the phone is the real safety.'],
 settings:['Fill in shop and doctor details – they appear on bills and prescriptions.','Set an Owner PIN so only you can see profit, reports and backups.'],
 more:['All other sections are here: suppliers, patients, notes, reports, backup and settings.'],
 audit:['Type what you physically counted on the shelf. Only differences are corrected.']};
A.help=()=>{const r=curRoute(),h=HELP[r]||HELP.dash;
  modal({title:'How to use this screen',sticky:false,html:`<div class="stack"><ul style="margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.5rem">${h.map(x=>`<li>${x}</li>`).join('')}</ul><div class="hr" style="margin:.2rem 0"></div><button class="btn" data-a="welcome">Show the welcome guide</button></div>`})};
A.welcome=()=>{if(modals.length>5)return;ls.set('hs_seen',true);const c=CFG();
  modal({title:'Welcome to '+APP,sticky:true,html:`<form class="stack" onsubmit="return false"><p style="margin:0">Let’s set up in one minute. You can change everything later in Settings.</p>${F.t('Shop / clinic name','shop',DB.get('settings','main')?c.shop:'',{placeholder:'e.g. Dr. Khan Homoeo Clinic & Store'})}${F.t('Doctor name (optional)','doc',c.doc)}${F.t('Shop phone (optional)','phone',c.phone)}
   <div class="mut" style="font-size:.9rem"><b>3 things to know:</b><br>① <b>Sell</b> – make bills, stock reduces by itself.<br>② <b>Medicines</b> – add stock when deliveries arrive.<br>③ <b>Patients</b> – keep every visit and medicine course.<br>④ <b>More → Backup</b> – keep a copy of your data safe.</div></form>`,
   foot:[{t:'Use sample data',fn:el=>{saveWelcome(el);loadDemo()}},{t:'Start with my own data',cls:'pri',fn:el=>{saveWelcome(el)}}]})};
function saveWelcome(el){const f=formData(el);DB.put('settings',{...(DB.get('settings','main')||{}),id:'main',shop:f.shop.trim()||DEFCFG.shop,doc:f.doc.trim(),phone:f.phone.trim()})}

</script>
</body>
</html>
