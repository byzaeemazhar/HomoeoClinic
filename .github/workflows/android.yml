name: Build Android APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: node build.js
      - name: Add Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Android permissions (storage for backups on old phones)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q WRITE_EXTERNAL_STORAGE $M || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' $M
          grep -q WRITE_EXTERNAL_STORAGE $M || sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application#' $M
      - name: Build APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
              -Pandroid.injected.signing.key.password="$KS_PASS"
            cp app/build/outputs/apk/release/app-release.apk ../HomoeoClinic.apk
          else
            echo "::warning::No signing key set - building a debug APK (updates will need uninstall; see README)"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../HomoeoClinic.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: HomoeoClinic-apk, path: HomoeoClinic.apk }
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HomoeoClinic.apk
          generate_release_notes: true
